<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to report real
         values in an iOS standalone web app; without it the camera frame sits
         under the notch and the home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08080a" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="One selfie a day, aligned to yesterday with a ghost overlay. Your photos sync privately across your devices."
    />

    <!-- iOS reads these rather than the manifest for home-screen behaviour. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Selfie" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <title>Selfie a Day</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Selfie a Day needs JavaScript for its camera, ghost overlay, and account sync.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
